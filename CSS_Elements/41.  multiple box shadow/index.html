<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiple Box Shadow Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f0f2f5;
        flex-direction: column;
      }

      .container {
        text-align: center;
        max-width: 800px;
        padding: 20px;
      }

      h1 {
        color: #333;
        margin-bottom: 10px;
      }

      .description {
        color: #666;
        margin-bottom: 30px;
        line-height: 1.6;
      }

      .shadow-box {
        width: 200px;
        height: 200px;
        background: #fff;
        border-radius: 10px;
        box-shadow: 10px 10px rgba(0, 0, 0, 0.4), 20px 20px rgba(0, 0, 0, 0.3),
          30px 30px rgba(0, 0, 0, 0.2), 40px 40px rgba(0, 0, 0, 0.1),
          50px 50px rgba(0, 0, 0, 0.05);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Multiple Box Shadows</h1>

      <div class="shadow-box"></div>
    </div>
  </body>
</html>
