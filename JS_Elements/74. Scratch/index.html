<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch Effect</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        @keyframes move {
            from {
                transform: translateY(0);
                opacity: 0;
            }

            to {
                opacity: 1;
                transform: translateY(100px);
            }
        }

        #js--sc--container {
            position: relative;
            margin: 0 auto;
            width: 300px;
            height: 300px;
            border: 1px solid black;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            transform: translateY(100px);
            opacity: 1;
            animation: move 2s;
        }

        #js--sc--container:before {
            content: '';
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("./images/loader.gif");
            background-repeat: no-repeat;
            background-position: center center;
        }

        #js--sc--container canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #js--sc--container img {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        #js-debug-cursor {
            position: absolute;
            top: 0;
            left: 0;
            background-color: yellow;
            width: 50px;
            height: 50px;
            z-index: 99;
            will-change: transform;
            -webkit-transition-duration: 300ms;
            transition-duration: 300ms;
        }

        .sc__wrapper {
            display: block;
            width: 100%;
            height: 300px;
            max-width: 300px;
            margin: 0 auto;
            border: 5px solid rgba(#FFF, 0.5);
        }

        /* Where the scratchcard will be generate. */
        .sc__container {
            position: relative;
            overflow: hidden;
            max-height: 300px;
            max-width: 300px;
        }

        .sc__inner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Background image, the result... */
        .sc__container>img {
            position: relative;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
        }

        /* The scratchcard generate with scratchcard-js */
        .sc__container canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
        }

        /* Scratchcard informations */
        .sc__infos {
            text-align: center;
            height: 40px;
            line-height: 40px;
            margin-top: 5px;
            font-weight: bold;
            font-size: 16px;
        }

        .test {
            color: lightsalmon;
            font-size: 20px;
            text-align: center;
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background-color: white;
        }
    </style>
</head>

<body>
        <div id="js--sc--container"></div>

        <script type="module" src="./scratchcard.js"></script>

        <script type="text/javascript">
            window.addEventListener('load', function () {
                var scContainer = document.getElementById('js--sc--container');
                var sc = new ScratchCard(scContainer, {
                    enabledPercentUpdate: true,
                    scratchType: SCRATCH_TYPE.SPRAY,
                    // brushSrc: './images/brush.png',
                    containerWidth: scContainer.offsetWidth,
                    containerHeight: 300,
                    imageForwardSrc: './images/scratchcard.png',
                    imageBackgroundSrc: '',
                    htmlBackground: '<p class="test"><strong>Hello i am HTML content !</strong></p>',
                    clearZoneRadius: 30,
                    percentToFinish: 50, // When the percent exceeds 50 on touchend event the callback will be exec.
                    nPoints: 30,
                    pointSize: 4,
                    callback: function () {
                        alert('Now the window will reload !');
                        window.location.reload();
                    }
                })
                sc.init();
            });
        </script>
</body>

</html>

<!-- https://masth0.github.io/ScratchCard/ -->
