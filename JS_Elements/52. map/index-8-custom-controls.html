<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaflet Demo 8 - Custom Controls</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; padding: 1rem; background: #1a1a2e; color: #eee; }
    h1 { margin-bottom: 0.5rem; font-size: 1.25rem; color: #00d9ff; }
    p { margin-bottom: 1rem; font-size: 0.9rem; opacity: 0.9; }
    #map { height: 500px; border-radius: 12px; border: 2px solid #333; }
    .custom-control { background: #16213e !important; color: #00d9ff !important; border: 2px solid #333 !important; padding: 8px 12px !important; border-radius: 8px !important; font-weight: bold; cursor: pointer; }
    .custom-control:hover { background: #0f3460 !important; }
  </style>
</head>
<body>
  <h1>Demo 8: Custom Controls</h1>
  <p>Custom buttons added to the map: reset view, zoom to NYC, and toggle fullscreen-style zoom.</p>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([40.7128, -74.0060], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const CustomControl = L.Control.extend({
      onAdd() {
        const div = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
        div.style.display = 'flex';
        div.style.flexDirection = 'column';
        div.style.gap = '6px';
        this.options.buttons.forEach(b => {
          const btn = L.DomUtil.create('button', 'custom-control');
          btn.innerHTML = b.label;
          btn.onclick = b.onClick;
          div.appendChild(btn);
        });
        return div;
      }
    });

    new CustomControl({
      buttons: [
        { label: 'Reset view', onClick: () => map.setView([40.7128, -74.0060], 13) },
        { label: 'Zoom to Liberty', onClick: () => map.setView([40.6892, -74.0445], 16) },
        { label: 'Zoom +', onClick: () => map.zoomIn() },
        { label: 'Zoom −', onClick: () => map.zoomOut() }
      ]
    }).addTo(map);
  </script>
</body>
</html>
