<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaflet Demo 3 - Circles, Polygons & Rectangles</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; padding: 1rem; background: #1a1a2e; color: #eee; }
    h1 { margin-bottom: 0.5rem; font-size: 1.25rem; color: #00d9ff; }
    p { margin-bottom: 1rem; font-size: 0.9rem; opacity: 0.9; }
    #map { height: 500px; border-radius: 12px; border: 2px solid #333; }
  </style>
</head>
<body>
  <h1>Demo 3: Shapes (Circles, Polygons, Rectangles)</h1>
  <p>Draw circles, rectangles, and polygons with custom fill and stroke styles.</p>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([40.7128, -74.0060], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const circle = L.circle([40.7128, -74.0060], {
      color: '#00d9ff',
      fillColor: '#00d9ff',
      fillOpacity: 0.3,
      weight: 2,
      radius: 800
    }).bindPopup('Circle: 800m radius').addTo(map);

    const rectangle = L.rectangle([
      [40.72, -74.02],
      [40.70, -73.99]
    ], {
      color: '#e74c3c',
      fillColor: '#e74c3c',
      fillOpacity: 0.2,
      weight: 2
    }).bindPopup('Rectangle area').addTo(map);

    const polygon = L.polygon([
      [40.75, -73.98],
      [40.74, -73.96],
      [40.76, -73.95],
      [40.77, -73.97]
    ], {
      color: '#2ecc71',
      fillColor: '#2ecc71',
      fillOpacity: 0.4,
      weight: 2
    }).bindPopup('Custom polygon').addTo(map);
  </script>
</body>
</html>
