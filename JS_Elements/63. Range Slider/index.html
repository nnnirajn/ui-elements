<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Range Slider Demo</title>
  <link rel="stylesheet" href="css/rSlider.min.css">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: #f5f5f5;
    }
    .demo {
      background: #fff;
      padding: 2.5rem;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      width: 100%;
      max-width: 420px;
    }
    h1 {
      margin: 0 0 1.5rem;
      font-size: 1.25rem;
      font-weight: 600;
      color: #333;
    }
    .slider-wrap {
      margin-bottom: 1rem;
    }
    .output {
      margin-top: 1rem;
      font-size: 0.875rem;
      color: #666;
    }
    .output strong { color: #00b3bc; }
  </style>
</head>
<body>
  <div class="demo">
    <h1>Range Slider</h1>
    <div class="slider-wrap">
      <input type="text" id="slider" />
    </div>
    <p class="output">Selected: <strong id="value">10 – 40</strong></p>
  </div>

  <script src="js/rSlider.min.js"></script>
  <script>
    var mySlider = new rSlider({
      target: '#slider',
      values: { min: 0, max: 100 },
      step: 25,        // small step = smooth, no visible snapping (use 1 for even smoother)
      range: true,
      set: [10, 40],
      scale: true,
      labels: true,
      tooltip: true,
      onChange: function (values) {
        document.getElementById('value').textContent = values;
      }
    });
  </script>
</body>
</html>
