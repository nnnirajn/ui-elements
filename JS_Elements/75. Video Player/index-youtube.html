<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vLitejs YouTube Video Player</title>
  <link href="https://cdn.jsdelivr.net/npm/vlitejs@6/dist/vlite.css" rel="stylesheet" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/vlitejs@6/dist/plugins/volume-bar.css" rel="stylesheet" crossorigin>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
    }
    h1 {
      color: #eee;
      margin-bottom: 1rem;
      font-size: 1.25rem;
      font-weight: 600;
    }
    .player-wrapper {
      width: 100%;
      max-width: 720px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .player-wrapper .v-vlite {
      --vlite-colorPrimary: #ff7f15;
    }
  </style>
</head>
<body>
  <h1>vLitejs YouTube Video Player</h1>
  <div class="player-wrapper">
    <div id="player" data-youtube-id="jNQXAC9IVRw"></div>
  </div>

  <script type="module">
    import Vlitejs from 'https://cdn.jsdelivr.net/npm/vlitejs@6/dist/vlite.js';
    import VlitejsYoutube from 'https://cdn.jsdelivr.net/npm/vlitejs@6/dist/providers/youtube.js';
    import VlitejsVolumeBar from 'https://cdn.jsdelivr.net/npm/vlitejs@6/dist/plugins/volume-bar.js';

    Vlitejs.registerProvider('youtube', VlitejsYoutube);
    Vlitejs.registerPlugin('volume-bar', VlitejsVolumeBar);

    new Vlitejs('#player', {
      options: {
        controls: true,
        autoplay: false,
        playPause: true,
        progressBar: true,
        time: true,
        volume: true,
        fullscreen: true,
        bigPlay: true,
        autoHide: true,
        autoHideDelay: 3000
      },
      provider: 'youtube',
      plugins: ['volume-bar'],
      onReady: (playerInstance) => {
        playerInstance.on('play', () => console.log('Playing'));
        playerInstance.on('pause', () => console.log('Paused'));
        playerInstance.on('ended', () => console.log('Ended'));
      }
    });
  </script>
</body>
</html>
