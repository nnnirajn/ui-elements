<!DOCTYPE html>
<html lang="en">
<head>
    <title>ProgressJS Demo</title>
</head>
<body>

    <div style="display: flex">
        <div class="progress-js" data-value="50" data-bg-color="transparent"></div>

        <div class="progress-js" data-value="4200" data-overall="5000" data-prefix="$" data-suffix=""></div>

        <div class="progress-js" data-width="500" data-height="500" data-stroke-width="3" data-value="50" data-font-size="2rem" data-font-weight="300"></div>
    </div>
    <script src="./progress.js"></script>

</body>
</html>

<!-- https://github.com/fkde/progress.js -->
